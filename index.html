<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 - K</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 60px 40px;
            text-align: center;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 60px;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .title {
            color: #667eea;
            font-size: 1.2em;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .bio {
            color: #666;
            line-height: 1.8;
            margin-bottom: 40px;
            font-size: 1.05em;
        }

        .skills {
            margin-bottom: 40px;
        }

        .skills h2 {
            color: #333;
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .skill-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .skill-tag {
            background: #f0f0f0;
            color: #667eea;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.95em;
            border: 2px solid #667eea;
        }

        .links {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .link-btn {
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1em;
        }

        .link-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .link-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .link-btn.secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .link-btn.secondary:hover {
            background: #f0f0f0;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 2em;
            }

            .profile-img {
                width: 120px;
                height: 120px;
                font-size: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-img">👨‍💻</div>

        <h1>K</h1>
        <p class="title">웹 개발자</p>

        <p class="bio">
            안녕하세요! 저는 사용자 경험을 중시하는 웹 개발자입니다.<br>
            새로운 기술과 창의적인 아이디어를 좋아합니다.
        </p>

        <div class="skills">
            <h2>기술 스택</h2>
            <div class="skill-list">
                <span class="skill-tag">HTML</span>
                <span class="skill-tag">CSS</span>
                <span class="skill-tag">JavaScript</span>
                <span class="skill-tag">React</span>
                <span class="skill-tag">Node.js</span>
            </div>
        </div>

        <div class="links">
            <a href="mailto:bosol095@gmail.com" class="link-btn primary">이메일 보내기</a>
            <a href="#" class="link-btn secondary">GitHub</a>
            <a href="#" class="link-btn secondary">포트폴리오</a>
        </div>
    </div>
</body>
</html>
